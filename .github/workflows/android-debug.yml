name: Verificación Android (sin claves de firma)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/builds-14
  pull_request:
    branches:
      - develop
      - main

jobs:
  debug-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar debug y ejecutar pruebas de modelo
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --stacktrace --no-daemon
